<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>PMPE 2027 — Painel de Estudos</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{--bg:#090909;--panel:#111;--panel2:#171717;--line:#292929;--muted:#929292;--text:#f5f5f5;--white:#fff;--accent:#d7d7d7;--green:#a7d7b5;--red:#e5a0a0;--yellow:#e7d19a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app-shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;min-height:100vh;background:#0d0d0d}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 34px}.brand-mark{width:38px;height:38px;border:1px solid #555;border-radius:11px;display:grid;place-items:center;font:800 21px Manrope;background:#171717}.brand strong{display:block;font:800 15px Manrope;letter-spacing:.4px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.4px;margin-top:3px}.sidebar nav{display:grid;gap:6px}.nav-item{border:0;background:transparent;color:#aaa;text-align:left;padding:12px 13px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:14px}.nav-item:hover,.nav-item.active{background:#202020;color:#fff}.nav-item.active{box-shadow:inset 2px 0 #fff}.sidebar-bottom{margin-top:auto}.sync-status{font-size:10px;color:var(--muted);line-height:1.5;padding:13px 10px}.main{padding:30px clamp(18px,4vw,56px);max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--muted);font-weight:700}h1{font:800 clamp(25px,3vw,34px) Manrope;margin:7px 0 0}.top-actions{display:flex;align-items:center;gap:15px;color:var(--muted);font-size:12px}.mobile-menu{display:none;background:#1c1c1c;color:white;border:1px solid var(--line);border-radius:8px;padding:8px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat-label{color:var(--muted);font-size:11px}.stat-value{font:800 28px Manrope;margin:9px 0 3px}.stat-note{font-size:11px;color:var(--muted)}.two-col{grid-template-columns:1.2fr .8fr}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-head h2,.card h2{font:700 16px Manrope;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.btn{border:1px solid #444;background:#f1f1f1;color:#090909;padding:10px 14px;border-radius:8px;font-weight:700;font-size:12px}.btn:hover{background:#d8d8d8}.btn.secondary{background:#1b1b1b;color:#eee;border-color:#3a3a3a}.btn.danger{background:#2a1717;color:#f2baba;border-color:#593333}.btn.small{padding:7px 10px}.muted{color:var(--muted)}.subject-row{display:grid;grid-template-columns:1fr 110px 42px;gap:12px;align-items:center;margin:17px 0}.subject-name{font-size:12px;font-weight:600}.bar{height:7px;background:#292929;border-radius:10px;overflow:hidden}.bar span{height:100%;display:block;background:#ddd;border-radius:10px}.subject-percent{text-align:right;font-size:11px;color:var(--muted)}.task{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-bottom:1px solid #242424}.task:last-child{border:0}.task input{accent-color:#eee;margin-top:3px}.task strong{font-size:12px;display:block}.task small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#242424;color:#ccc;font-size:10px}.pill.good{color:var(--green)}.pill.warn{color:var(--yellow)}.pill.bad{color:var(--red)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#bbb}.field input,.field select,.field textarea{width:100%;background:#0b0b0b;border:1px solid #333;border-radius:8px;color:#fff;padding:11px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#888}.form-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #282828;font-size:11px}th{color:var(--muted);font-weight:600}td{color:#ddd}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}.calendar-day{padding:14px;border:1px solid var(--line);background:#111;border-radius:11px}.calendar-day.today{border-color:#aaa}.calendar-day h3{font:700 13px Manrope;margin:0 0 7px}.calendar-day p{font-size:11px;color:#bbb;margin:5px 0}.calendar-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chart{height:150px;display:flex;align-items:end;gap:9px;padding-top:15px}.chart-col{flex:1;display:grid;gap:7px;justify-items:center;height:100%;align-content:end}.chart-bar{width:min(100%,30px);background:#ddd;border-radius:5px 5px 0 0;min-height:2px}.chart-col small{font-size:9px;color:var(--muted)}.notice{padding:13px;border:1px solid #343434;border-radius:9px;background:#151515;color:#bbb;font-size:11px;line-height:1.6}.toast{position:fixed;bottom:22px;right:22px;background:#eee;color:#111;padding:12px 16px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}footer{padding:30px 0 10px;text-align:center;color:#666;font-size:10px}.mobile-only{display:none}
@media(max-width:850px){.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:5;left:-260px;top:0;width:248px;transition:.2s;box-shadow:15px 0 40px #0008}.sidebar.open{left:0}.mobile-menu{display:block}.main{padding:22px 16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.calendar-grid{grid-template-columns:1fr}}@media(max-width:480px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stat-value{font-size:24px}.subject-row{grid-template-columns:1fr 75px 34px}}

</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div><div><strong>PMPE 2027</strong><small>PAINEL DO CANDIDATO</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-page="inicio">▦ <span>Visão geral</span></button>
        <button class="nav-item" data-page="cronograma">▤ <span>Cronograma</span></button>
        <button class="nav-item" data-page="registro">＋ <span>Registrar estudo</span></button>
        <button class="nav-item" data-page="desempenho">⌁ <span>Desempenho</span></button>
        <button class="nav-item" data-page="erros">✎ <span>Caderno de erros</span></button>
        <button class="nav-item" data-page="redacao">▧ <span>Redação</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div id="sync-status" class="sync-status">● Modo local — configure a sincronização</div>
        <button class="nav-item" data-page="config">⚙ <span>Configurações</span></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">PREPARAÇÃO • SOLDADO • AOCP</div><h1 id="page-title">Visão geral</h1></div>
        <div class="top-actions"><span id="today-label"></span><button class="mobile-menu" id="menu-btn">☰</button></div>
      </header>
      <div id="content"></div>
      <footer>PMPE 2027 • Seu progresso é construído um dia de cada vez.</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script>
/* PMPE 2027 — aplicação estática com armazenamento local e sincronização opcional via Supabase.
   Configure URL e anon key em config.js (copie config.example.js para config.js). */
const EXAM_DATE = "2027-02-21";
const SUBJECTS = ["Português","História de Pernambuco","Raciocínio Lógico","Informática","Direito Constitucional","Direitos Humanos e Legislação Extravagante"];
const PLAN = [
 ["Segunda","Português","Interpretação de textos; tipologia e gêneros textuais","Direito Constitucional","Princípios fundamentais; direitos e garantias fundamentais"],
 ["Terça","Direitos Humanos e Legislação Extravagante","Conceitos, características e sistemas de proteção","Raciocínio Lógico","Proposições; conectivos; tabelas-verdade"],
 ["Quarta","Português","Conectivos; coesão e coerência; classes de palavras","Direito Constitucional","Organização do Estado; administração pública; segurança pública"],
 ["Quinta","Direitos Humanos e Legislação Extravagante","Declaração Universal; tratados e legislação do edital","Informática","Sistemas operacionais; internet; segurança da informação"],
 ["Sexta","Português","Sintaxe; concordância; regência; crase; pontuação","Raciocínio Lógico","Equivalências; negações; argumentos e problemas"],
 ["Sábado","História de Pernambuco","Colonização; economia açucareira; invasões e revoluções","Direitos Humanos e Legislação Extravagante","Revisão da legislação e questões"],
 ["Domingo","Informática","Aplicativos, redes, segurança e revisão","História de Pernambuco","Revisão semanal + redação"]
];
const $ = s => document.querySelector(s);
const todayISO = () => new Date().toLocaleDateString("en-CA");
const dateBR = d => new Date(d+"T12:00:00").toLocaleDateString("pt-BR");
const dayName = d => new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long"});
const uid = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random();
let state = loadState(), page = "inicio";
function loadState(){try{return JSON.parse(localStorage.getItem("pmpe2027")||"{}")}catch{return {}}}
function saveState(){localStorage.setItem("pmpe2027",JSON.stringify(state));}
function init(){ $("#today-label").textContent=dateBR(todayISO()); setupNav(); setupSupabase(); render(); }
function setupNav(){document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.page===page));$("#page-title").textContent=({inicio:"Visão geral",cronograma:"Cronograma",registro:"Registrar estudo",desempenho:"Desempenho",erros:"Caderno de erros",redacao:"Redação",config:"Configurações"})[page];$("#content").innerHTML="";render();$("#sidebar")?.classList.remove("open");document.querySelector(".sidebar").classList.remove("open")}));$("#menu-btn").onclick=()=>document.querySelector(".sidebar").classList.toggle("open")}
function records(){return state.records||[]} function errors(){return state.errors||[]} function essays(){return state.essays||[]}
function totalHours(){return records().reduce((s,r)=>s+(Number(r.minutes)||0),0)/60}
function totals(){let o={};SUBJECTS.forEach(s=>o[s]={q:0,c:0});records().forEach(r=>{if(o[r.subject]){o[r.subject].q+=+r.questions||0;o[r.subject].c+=+r.correct||0}});return o}
function pct(s){let t=totals()[s];return t.q?Math.round(t.c/t.q*100):0}
function showToast(t){let el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2300)}
function card(label,value,note){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function render(){let c=$("#content");if(page==="inicio")c.innerHTML=home();if(page==="cronograma")c.innerHTML=schedule();if(page==="registro")c.innerHTML=recordForm();if(page==="desempenho")c.innerHTML=performance();if(page==="erros")c.innerHTML=errorPage();if(page==="redacao")c.innerHTML=essayPage();if(page==="config")c.innerHTML=configPage();bindPage()}
function home(){let t=totals(),q=Object.values(t).reduce((a,x)=>a+x.q,0),a=Object.values(t).reduce((a,x)=>a+x.c,0),days=Math.max(0,Math.ceil((new Date(EXAM_DATE+"T12:00:00")-new Date(todayISO()+"T12:00:00"))/86400000));let todayPlan=planFor(todayISO());return `
<div class="grid stats">${card("DIAS ATÉ A PROVA",days,"Prova prevista para 21/02/2027")}${card("HORAS ESTUDADAS",totalHours().toFixed(1)+"h","Meta: 3 horas por dia")}${card("QUESTÕES RESOLVIDAS",q,"Acertos: "+a)}${card("APROVEITAMENTO",q?Math.round(a/q*100)+"%":"0%","Média geral registrada")}</div>
<div class="grid two-col">
<section class="card"><div class="section-head"><div><h2>Desempenho por matéria</h2><p>Percentual de acertos acumulado</p></div><button class="btn secondary small" data-go="desempenho">Ver detalhes</button></div>
${SUBJECTS.map(s=>`<div class="subject-row"><div class="subject-name">${s}</div><div class="bar"><span style="width:${pct(s)}%"></span></div><div class="subject-percent">${pct(s)}%</div></div>`).join("")}
</section>
<section class="card"><div class="section-head"><div><h2>Missão de hoje</h2><p>${dateBR(todayISO())} • ${dayName(todayISO())}</p></div><span class="pill">3 horas</span></div>
${todayPlan.map(x=>`<div class="task"><div><strong>${x.subject}</strong><small>${x.topic}</small></div></div>`).join("")}
<button class="btn" data-go="registro">Registrar meu estudo</button>
</section>
<section class="card"><div class="section-head"><div><h2>Últimos registros</h2><p>Seu histórico de estudos</p></div></div>${records().slice(-5).reverse().map(r=>`<div class="task"><div style="flex:1"><strong>${r.subject}</strong><small>${dateBR(r.date)} • ${r.minutes} min • ${r.correct}/${r.questions} acertos</small></div><span class="pill">${r.questions?Math.round(r.correct/r.questions*100):0}%</span></div>`).join("")||'<div class="empty">Você ainda não registrou estudos.</div>'}</section>
<section class="card"><h2>Meta desta semana</h2><p class="muted" style="font-size:12px">Registre suas sessões para acompanhar seu ritmo.</p><div class="stat-value">${Math.round(records().filter(r=>weekStart(r.date)===weekStart(todayISO())).reduce((a,r)=>a+(+r.minutes||0),0)/60*10)/10}h <span class="muted" style="font-size:13px">/ 21h</span></div><div class="bar"><span style="width:${Math.min(100,records().filter(r=>weekStart(r.date)===weekStart(todayISO())).reduce((a,r)=>a+(+r.minutes||0),0)/1260*100)}%"></span></div><p class="stat-note">Meta semanal de 21 horas</p></section></div>`}
function planFor(d){let idx=(new Date(d+"T12:00:00").getDay()+6)%7,p=PLAN[idx];return [{subject:p[1],topic:p[2]},{subject:p[3],topic:p[4]}]}
function schedule(){let start=new Date(todayISO()+"T12:00:00");let cards="";for(let i=0;i<14;i++){let d=new Date(start);d.setDate(d.getDate()+i);let iso=d.toLocaleDateString("en-CA"),p=planFor(iso),done=records().some(r=>r.date===iso);cards+=`<div class="calendar-day ${i===0?"today":""}"><div class="section-head"><h3>${dayName(iso)} • ${dateBR(iso)}</h3><span class="pill ${done?"good":""}">${done?"Com registro":"Planejado"}</span></div>${p.map(x=>`<p><b>${x.subject}:</b> ${x.topic}</p>`).join("")}<p class="muted">Meta: 3h • 40–60 questões</p></div>`}
return `<div class="section-head"><div><h2>Seu ciclo semanal</h2><p>Plano-base ajustado às suas dificuldades. Os tópicos são uma trilha inicial; confira sempre o conteúdo literal do edital.</p></div><button class="btn secondary" onclick="window.print()">Imprimir</button></div><div class="calendar-grid">${cards}</div><div class="notice" style="margin-top:14px">A programação se repete semanalmente. Use a tela “Registrar estudo” para marcar o que realmente concluiu. Se perder um dia, retome o ciclo sem tentar compensar com excesso de horas.</div>`}
function recordForm(){return `<div class="card"><div class="section-head"><div><h2>Registrar sessão de estudo</h2><p>Registre cada matéria separadamente para medir seu desempenho.</p></div></div><form id="record-form"><div class="form-grid"><div class="field"><label>Data</label><input name="date" type="date" value="${todayISO()}" required></div><div class="field"><label>Matéria</label><select name="subject" required>${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select></div><div class="field"><label>Assunto estudado</label><input name="topic" placeholder="Ex.: Direitos e garantias fundamentais"></div><div class="field"><label>Tempo estudado (minutos)</label><input name="minutes" type="number" min="1" max="600" value="60" required></div><div class="field"><label>Questões resolvidas</label><input name="questions" type="number" min="0" value="20" required></div><div class="field"><label>Questões acertadas</label><input name="correct" type="number" min="0" value="12" required></div><div class="field full"><label>Observações / dificuldades</label><textarea name="notes" placeholder="O que entendeu? O que precisa revisar?"></textarea></div></div><div class="form-actions"><button class="btn">Salvar registro</button><button type="reset" class="btn secondary">Limpar</button></div></form></div><div class="card" style="margin-top:14px"><h2>Histórico recente</h2>${records().slice(-10).reverse().map(r=>`<div class="task"><div style="flex:1"><strong>${r.subject} — ${r.topic||"Sem assunto informado"}</strong><small>${dateBR(r.date)} • ${r.minutes} min • ${r.correct}/${r.questions} acertos</small></div><button class="btn danger small" data-delete-record="${r.id}">Excluir</button></div>`).join("")||'<div class="empty">Nenhum registro ainda.</div>'}</div>`}
function performance(){let t=totals(),q=Object.values(t).reduce((a,x)=>a+x.q,0),c=Object.values(t).reduce((a,x)=>a+x.c,0);return `<div class="grid stats">${card("QUESTÕES",q,"Total registrado")}${card("ACERTOS",c,"Total de respostas corretas")}${card("ERROS",q-c,"Questões para revisar")}${card("MÉDIA",q?Math.round(c/q*100)+"%":"0%","Aproveitamento geral")}</div><div class="card"><h2>Desempenho por disciplina</h2><div class="table-wrap"><table><thead><tr><th>Matéria</th><th>Questões</th><th>Acertos</th><th>Erros</th><th>Aproveitamento</th><th>Orientação</th></tr></thead><tbody>${SUBJECTS.map(s=>{let x=t[s],p=x.q?Math.round(x.c/x.q*100):0;return `<tr><td>${s}</td><td>${x.q}</td><td>${x.c}</td><td>${x.q-x.c}</td><td>${p}%</td><td>${!x.q?"Registrar":p<60?"Reforçar teoria":p<80?"Consolidar":"Manter revisões"}</td></tr>`}).join("")}</tbody></table></div></div><div class="card" style="margin-top:14px"><h2>Últimos 7 dias — horas registradas</h2><div class="chart">${last7().map(x=>`<div class="chart-col"><div class="chart-bar" style="height:${Math.max(2,Math.min(100,x.hours/3*100))}%"></div><small>${x.label}</small></div>`).join("")}</div></div>`}
function last7(){let a=[];for(let i=6;i>=0;i--){let d=new Date(todayISO()+"T12:00:00");d.setDate(d.getDate()-i);let iso=d.toLocaleDateString("en-CA");a.push({label:d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),hours:records().filter(r=>r.date===iso).reduce((s,r)=>s+(+r.minutes||0),0)/60})}return a}
function errorPage(){return `<div class="card"><div class="section-head"><div><h2>Registrar erro</h2><p>Transforme cada erro em um ponto de revisão.</p></div></div><form id="error-form"><div class="form-grid"><div class="field"><label>Matéria</label><select name="subject">${SUBJECTS.map(s=>`<option>${s}</option>`).join("")}</select></div><div class="field"><label>Data</label><input name="date" type="date" value="${todayISO()}"></div><div class="field full"><label>Assunto / questão</label><input name="topic" required placeholder="Qual assunto ou questão você errou?"></div><div class="field full"><label>Por que errei?</label><select name="reason"><option>Não sabia o conteúdo</option><option>Confundi conceitos</option><option>Interpretei errado</option><option>Falta de atenção</option><option>Errei o cálculo</option></select></div><div class="field full"><label>Correção / explicação</label><textarea name="fix" placeholder="Escreva a explicação correta"></textarea></div></div><div class="form-actions"><button class="btn">Salvar erro</button></div></form></div><div class="card" style="margin-top:14px"><h2>Erros para revisar</h2>${errors().slice().reverse().map(e=>`<div class="task"><div style="flex:1"><strong>${e.subject}: ${e.topic}</strong><small>${dateBR(e.date)} • ${e.reason}</small><small>${e.fix||"Sem correção registrada"}</small></div><button class="btn secondary small" data-done-error="${e.id}">Revisado</button></div>`).join("")||'<div class="empty">Seu caderno está vazio. Registre os erros das questões.</div>'}</div>`}
function essayPage(){return `<div class="card"><h2>Registrar redação</h2><p class="muted" style="font-size:12px">Registre a prática e a nota recebida na correção.</p><form id="essay-form"><div class="form-grid"><div class="field"><label>Data</label><input name="date" type="date" value="${todayISO()}"></div><div class="field"><label>Tema</label><input name="topic" required placeholder="Tema da redação"></div><div class="field"><label>Nota (0 a 40)</label><input name="score" type="number" min="0" max="40" step=".5" placeholder="0"></div><div class="field"><label>Tempo gasto (minutos)</label><input name="minutes" type="number" min="1" placeholder="60"></div><div class="field full"><label>O que melhorar?</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button class="btn">Salvar redação</button></div></form></div><div class="card" style="margin-top:14px"><h2>Histórico de redações</h2>${essays().slice().reverse().map(e=>`<div class="task"><div><strong>${e.topic}</strong><small>${dateBR(e.date)} • Nota: ${e.score??"Não informada"}/40 • ${e.minutes||"—"} min</small><small>${e.notes||""}</small></div></div>`).join("")||'<div class="empty">Nenhuma redação registrada.</div>'}</div>`}
function configPage(){return `<div class="card"><h2>Sincronização entre dispositivos</h2><p class="muted" style="font-size:12px;line-height:1.6">Este projeto usa Supabase para login e sincronização. Crie um projeto gratuito no Supabase, execute o arquivo <b>supabase-schema.sql</b> no SQL Editor e configure a URL e a chave pública (anon key) em <b>config.js</b>. Sem essa configuração, o aplicativo continua funcionando neste navegador, mas não sincroniza com outros dispositivos.</p><div class="notice">Nunca coloque a chave service_role no site. Use somente a chave anon/public com as políticas de segurança (RLS) fornecidas no projeto.</div><div id="auth-area" style="margin-top:16px">${authMarkup()}</div></div><div class="card" style="margin-top:14px"><h2>Backup dos seus dados</h2><p class="muted" style="font-size:12px">Exporte um arquivo JSON para guardar uma cópia. Você pode importar esse arquivo em outro navegador.</p><div class="form-actions"><button class="btn" id="export-btn">Exportar backup</button><label class="btn secondary">Importar backup<input id="import-file" type="file" accept="application/json" hidden></label><button class="btn danger" id="clear-btn">Apagar dados locais</button></div></div>`}
function authMarkup(){return user?`<p>Conectado como <b>${user.email}</b></p><button class="btn secondary" id="logout">Sair</button><button class="btn" id="sync-now">Sincronizar agora</button>`:`<form id="login-form"><div class="form-grid"><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Senha (mínimo 6 caracteres)</label><input name="password" type="password" minlength="6" required></div></div><div class="form-actions"><button class="btn">Entrar / criar conta</button></div></form><p class="muted" style="font-size:11px">Se o e-mail ainda não estiver cadastrado, o app tentará criar uma conta. Dependendo das configurações do Supabase, será necessário confirmar o e-mail.</p>`}
function bindPage(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;document.querySelector(`[data-page="${page}"]`).click()});
 $("#record-form")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target),q=+f.get("questions"),c=+f.get("correct");if(c>q)return showToast("Acertos não podem superar questões.");state.records=[...records(),{id:uid(),date:f.get("date"),subject:f.get("subject"),topic:f.get("topic"),minutes:+f.get("minutes"),questions:q,correct:c,notes:f.get("notes")}];saveState();showToast("Estudo registrado!");render()});
 $("#error-form")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);state.errors=[...errors(),{id:uid(),date:f.get("date"),subject:f.get("subject"),topic:f.get("topic"),reason:f.get("reason"),fix:f.get("fix")}];saveState();showToast("Erro salvo no caderno.");render()});
 $("#essay-form")?.addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);state.essays=[...essays(),{id:uid(),date:f.get("date"),topic:f.get("topic"),score:f.get("score")===""?null:+f.get("score"),minutes:+f.get("minutes")||null,notes:f.get("notes")}];saveState();showToast("Redação registrada!");render()});
 document.querySelectorAll("[data-delete-record]").forEach(b=>b.onclick=()=>{state.records=records().filter(r=>r.id!==b.dataset.deleteRecord);saveState();render()});
 document.querySelectorAll("[data-done-error]").forEach(b=>b.onclick=()=>{state.errors=errors().filter(r=>r.id!==b.dataset.doneError);saveState();render();showToast("Erro marcado como revisado.")});
 $("#export-btn")?.addEventListener("click",()=>download(JSON.stringify(state,null,2),"pmpe-2027-backup.json"));
 $("#import-file")?.addEventListener("change",async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!confirm("Substituir os dados locais pelo backup?"))return;state=x;saveState();render();showToast("Backup importado.")}catch{showToast("Arquivo de backup inválido.")}});
 $("#clear-btn")?.addEventListener("click",()=>{if(confirm("Apagar todos os dados locais? Faça backup antes. Esta ação não apaga dados já sincronizados no servidor.")){localStorage.removeItem("pmpe2027");state={};render();showToast("Dados locais apagados.")}});

}
function download(data,name){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function weekStart(d){let x=new Date(d+"T12:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toLocaleDateString("en-CA")}
function setupSupabase(){$("#sync-status").textContent="● Armazenamento local neste dispositivo";}
function updateSyncUI(){$("#sync-status").textContent="● Armazenamento local neste dispositivo"}
init();

</script>
</body>
</html>
